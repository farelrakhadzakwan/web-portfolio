<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --bg: #090d16;
      --border: rgba(255, 255, 255, 0.16);
      --letter: #ffffff;
      --dot: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: #cbd5e1;
        --letter: #090d16;
        --dot: #2563eb;
