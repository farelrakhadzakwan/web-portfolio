<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark silhouette outline for visibility on bright tab themes -->
  <g stroke="#0F172A" stroke-linecap="round" stroke-linejoin="round">
    <line x1="32" y1="12" x2="14" y2="48" stroke-width="6" />
    <line x1="32" y1="12" x2="50" y2="48" stroke-width="6" />
    <line x1="14" y1="48" x2="50" y2="48" stroke-width="6" />
    <line x1="32" y1="12" x2="32" y2="33" stroke-width="6" />
    <line x1="14" y1="48" x2="32" y2="33" stroke-width="6" />
    <line x1="50" y1="48" x2="32" y2="33" stroke-width="6" />
    <circle cx="32" cy="12" r="8.5" fill="#0F172A" />
    <circle cx="14" cy="48" r="8.5" fill="#0F172A" />
    <circle cx="50" cy="48" r="8.5" fill="#0F172A" />
    <circle cx="32" cy="33" r="10" fill="#0F172A" />
  </g>

  <!-- Outer perimeter synapses (Cyan) -->
  <line x1="32" y1="12" x2="14" y2="48" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="12" x2="50" y2="48" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="14" y1="48" x2="50" y2="48" stroke-width="3" stroke-linecap="round" />

  <!-- Center radiating synapses (Indigo) -->
  <line x1="32" y1="12" x2="32" y2="33" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="14" y1="48" x2="32" y2="33" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="48" x2="32" y2="33" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Outer Neural Nodes (Electric Cyan) -->
  <circle cx="32" cy="12" r="6.5" fill="#38BDF8" />
  <circle cx="32" cy="12" r="2.8" fill="#FFFFFF" />

  <circle cx="14" cy="48" r="6.5" fill="#38BDF8" />
  <circle cx="14" cy="48" r="2.8" fill="#FFFFFF" />

  <circle cx="50" cy="48" r="6.5" fill="#38BDF8" />
  <circle cx="50" cy="48" r="2.8" fill="#FFFFFF" />

  <!-- Center Core Node (Purple/Violet Core) -->
  <circle cx="32" cy="33" r="8" fill="#A855F7" />
  <circle cx="32" cy="33" r="3.2" fill="#FFFFFF" />
</svg>
