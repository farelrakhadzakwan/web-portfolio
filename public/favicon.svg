<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </radialGradient>
  </defs>

  <!-- Background squircle: solid static theme -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#090D18" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

  <!-- Outer perimeter connections -->
  <line x1="32" y1="16" x2="16" y2="45" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
  <line x1="32" y1="16" x2="48" y2="45" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
  <line x1="16" y1="45" x2="48" y2="45" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

  <!-- Center radiating synapses -->
  <line x1="32" y1="16" x2="32" y2="32" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="16" y1="45" x2="32" y2="32" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="48" y1="45" x2="32" y2="32" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Outer Neural Nodes (Cyan) -->
  <circle cx="32" cy="16" r="6" fill="#38BDF8" />
  <circle cx="32" cy="16" r="2.5" fill="#FFFFFF" />

  <circle cx="16" cy="45" r="6" fill="#38BDF8" />
  <circle cx="16" cy="45" r="2.5" fill="#FFFFFF" />

  <circle cx="48" cy="45" r="6" fill="#38BDF8" />
  <circle cx="48" cy="45" r="2.5" fill="#FFFFFF" />

  <!-- Center Core Node (Purple/Indigo Core) -->
  <circle cx="32" cy="32" r="7" fill="url(#coreGlow)" />
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />
</svg>
