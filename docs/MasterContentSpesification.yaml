# ============================================================
# 20. WRITING RULES
# ============================================================

content_rules:

  - >
    Prioritize measurable results whenever verified metrics are available.

  - >
    Clearly distinguish personal contribution from overall team/project
    outcomes.

  - >
    Use technically accurate terminology.

  - >
    Do not convert academic projects into professional employment claims.

  - >
    Do not invent technologies, metrics, users, deployments, publications,
    certifications, companies, or responsibilities.

  - >
    Do not remove information simply because it appears only in LinkedIn
    or in previously supplied project context.

  - >
    CV information should enrich rather than replace existing portfolio
    information.

  - >
    Project descriptions should emphasize problem → method → result →
    impact.

  - >
    Avoid generic statements such as "worked on AI" when a technical
    description is available.


