featured_projects:


  # ----------------------------------------------------------
  # 01 — UNDERGRADUATE THESIS
  # ----------------------------------------------------------

  - title:
      "Latent EEG Representation Learning Using GMM-HMM for Stress Pattern Analysis"

    category:
      - AI Research
      - Machine Learning
      - EEG Signal Processing
      - Probabilistic Modeling

    type:
      "Undergraduate Thesis"

    period:
      "August 2025 – July 2026"

    role:
      "AI Researcher"

    objective:
      >
      Analyze the latent structure and temporal dynamics of EEG signals
      using GMM-HMM to study probabilistic representations of patterns
      associated with stress-inducing activities.

    dataset:
      type:
        "Secondary EEG Dataset"

      participants:
        50

      device:
        "Muse Headband 2"

      channels:
        - TP9
        - AF7
        - AF8
        - TP10

      activities:
        - pre_activity
        - pauli_test
        - translate_test
        - questionnaire_test
        - post_activity

    sampling_configurations:
      - "20 Hz"
      - "40 Hz"

    preprocessing:
      - Resampling
      - Filtering
      - Windowing
      - 2-second windows
      - 50% overlap

    feature_extraction:
      method:
        "Welch Power Spectral Density"

      frequency_bands:
        - Delta
        - Theta
        - Alpha
        - Beta

      beta_rule:
        >
        Beta band was included in the 40 Hz experimental configuration.

      feature_structure:
        >
        Multi-channel bandpower features generated from EEG channels
        and frequency bands.

      feature_vector:
        "Sequential Feature Matrix"

    normalization:
      - Z-score normalization

    modeling:
      model:
        "Gaussian Mixture Model Hidden Markov Model (GMM-HMM)"

      model_selection:
        "Bayesian Information Criterion (BIC)"

      best_configuration:
        hidden_states: 5
        gaussian_mixture_components: 4

    latent_states:
      notation:
        - S0
        - S1
        - S2
        - S3
        - S4

      interpretation_rule:
        >
        S0–S4 are internal probabilistic latent states and must not be
        presented as directly corresponding to physiological states.

    pseudo_labeling:
      method:
        "K-Means"

      number_of_clusters:
        3

      representation:
        - Hidden-state proportions
        - Average log-likelihood per sample

      interpretation:
        - Low
        - Medium
        - High

      scientific_note:
        >
        Pseudo-label groups represent probabilistic representation
        characteristics and must not be presented as direct physiological
        stress levels.

    model_results:

      20Hz:
        hidden_states: 5
        mixture_components: 4
        bic:
          "-13,064,842.05"
        silhouette_score:
          "0.3601"

      40Hz:
        hidden_states: 5
        mixture_components: 4
        bic:
          "-20,171,790.88"

    primary_result:
      >
      The 40 Hz configuration produced the lowest BIC, approximately
      -20.17 million, indicating the strongest model-selection criterion
      among the evaluated configurations.

    additional_result:
      >
      The 20 Hz configuration produced a higher silhouette score of
      0.3601 than the 40 Hz configuration.

    validation:
      models:
        - Random Forest
        - SVM
        - XGBoost

    technologies:
      - Python
      - NumPy
      - SciPy
      - Scikit-learn
      - GMM-HMM
      - K-Means

    featured:
      true


